apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanwuya-lab3-5-prod-deployment
spec:
  replicas: 1  # Number of NGINX pods to run
  selector:
    matchLabels:
      app: sanwuya-lab3-5-prod
  template:
    metadata:
      labels:
        app: sanwuya-lab3-5-prod
    spec:
      containers:
      - name: nginx
        image: cithit/sanwuya:latest                             #<----change this!
        ports:
        - containerPort: 80  # Expose NGINX on port 80      
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sanwuya-lab3-5-prod-ingress
spec:
  rules: 
  - host: 
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend: 
          service:
            name: sanwuya-lab3-5-prod-service
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: sanwuya-lab3-5-prod-service
spec:
  type: LoadBalancer 
  loadBalancerIP: 10.48.229.35                                 # <-----change this!!!!
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  selector:
    app: sanwuya-lab3-5-prod
