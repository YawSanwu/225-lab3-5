
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanwuya-lab3-5-prod-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sanwuya-lab3-5-prod
  template:
    metadata:
      labels:
        app: sanwuya-lab3-5-prod
    spec:
      containers:
        - name: nginx
          image: cithit/sanwuya:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: sanwuya-lab3-5-prod-service
spec:
  type: LoadBalancer
  loadBalancerIP: 10.48.229.35
  selector:
    app: sanwuya-lab3-5-prod
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
