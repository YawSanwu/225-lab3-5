apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanwuya-lab3-5-dev-deployment
spec:
  replicas: 1  # Number of NGINX pods to run
  selector:
    matchLabels:
      app: sanwuya-lab3-5-dev
  template:
    metadata:
      labels:
        app: sanwuya-lab3-5-dev
    spec:
      containers:
      - name: nginx
        image: cithit/sanwuya:latest      #<---change this!
        ports:
        - containerPort: 80  # Expose NGINX on port 80   
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sanwuya-lab3-5dev-ingress
spec:
  rules: 
  - host: 
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend: 
          service:
            name: sanwuya-lab3-5-dev-service
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: sanwuya-lab3-5-dev-service
spec:
  selector:
    sanwuya-lab3-5dev
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

