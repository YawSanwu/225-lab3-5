
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = /lab3-5 {
        return 301 /lab3-5/;
    }

    location /lab3-5/ {
        alias /usr/share/nginx/html/;
        index index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
