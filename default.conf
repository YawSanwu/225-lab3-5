
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = /lab3-5 {
        return 301 /lab3-5/;
    }

    location = /lab3-5/ {
        try_files /lab3-5/index.html =404;
    }

    location /lab3-5/ {
        try_files $uri =404;
    }
}
